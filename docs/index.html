<!doctype html>
<html lang="en">
  <head>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>TRAFFER — build the city, keep it moving</title>
    <meta
      name="description"
      content="TRAFFER is a road-building traffic puzzle game. Draw streets, avenues and freeways, connect the districts and keep the city moving — 36 campaign levels, endless seeded cities, a daily challenge and full sandbox."
    />
    <meta name="theme-color" content="#0b1015" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Traffer" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* critical inline styles: splash + reset so there is never a white flash */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b1015;
        color: #e8eef2;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          sans-serif;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 90% at 50% 0%, #16212b 0%, #0b1015 60%, #070a0d 100%);
        z-index: 9999;
        transition: opacity 0.45s ease;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: min(38vw, 132px);
        height: auto;
        filter: drop-shadow(0 6px 24px rgba(255, 176, 32, 0.28));
      }
      #splash .t {
        font-size: clamp(20px, 5vw, 30px);
        font-weight: 800;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: #f2f7fa;
      }
      #splash .count {
        font-variant-numeric: tabular-nums;
        font-size: clamp(28px, 8vw, 42px);
        font-weight: 800;
        letter-spacing: 0.02em;
        color: #ffb020;
        line-height: 1;
        min-width: 4.2ch;
        text-align: center;
      }
      #splash .stage {
        min-height: 1.2em;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8fa9bd;
      }
      #splash .b {
        width: min(58vw, 240px);
        height: 4px;
        border-radius: 99px;
        background: #1d2a35;
        overflow: hidden;
      }
      #splash .b i {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: 99px;
        background: linear-gradient(90deg, #ffb020, #ff7a3d);
      }
      #splash .err {
        display: none;
        max-width: min(78vw, 320px);
        margin: 0;
        text-align: center;
        font-size: 13px;
        line-height: 1.45;
        color: #d5e2ea;
      }
      #splash .retry {
        display: none;
        margin-top: 4px;
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        font: inherit;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #1a1206;
        background: #ffb020;
        cursor: pointer;
      }
      #splash.fail .count {
        color: #e8503a;
      }
      #splash.fail .err,
      #splash.fail .retry {
        display: block;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DUniEfVC.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DgOPO6ds.css">
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="116" height="116" rx="30" fill="#121c25" />
        <path
          d="M20 96C42 96 40 74 62 74C84 74 82 52 108 52"
          stroke="#2c3d4c"
          stroke-width="18"
          stroke-linecap="round"
        />
        <path
          d="M20 96C42 96 40 74 62 74C84 74 82 52 108 52"
          stroke="#ffb020"
          stroke-width="9"
          stroke-linecap="round"
        />
        <path d="M24 40h34" stroke="#3d566a" stroke-width="11" stroke-linecap="round" />
        <path d="M24 40h34" stroke="#8fa9bd" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 9" />
        <circle cx="62" cy="74" r="6.5" fill="#0b1015" stroke="#8fa9bd" stroke-width="3" />
        <rect x="76" y="66" width="15" height="9" rx="3" fill="#e8503a" transform="rotate(-18 76 66)" />
      </svg>
      <div class="t">TRAFFER</div>
      <div class="count" id="splash-count">0%</div>
      <div class="b" id="splash-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading">
        <i id="splash-bar"></i>
      </div>
      <div class="stage" id="splash-stage">Starting</div>
      <p class="err" id="splash-err"></p>
      <button class="retry" type="button" onclick="location.reload()">Retry</button>
    </div>
    <div id="app"></div>
    <script>
      /* Runs before the module so a missing bundle can't leave an endless spinner. */
      (function () {
        var pct = 0;
        var target = 1;
        var label = 'Starting';
        var failed = false;
        var done = false;
        var reported = false;
        function $(id) {
          return document.getElementById(id);
        }
        function render() {
          var shown = Math.max(0, Math.min(100, Math.round(pct)));
          var bar = $('splash-bar');
          var count = $('splash-count');
          var stage = $('splash-stage');
          var track = $('splash-track');
          if (bar) bar.style.width = shown + '%';
          if (count) count.textContent = shown + '%';
          if (stage) stage.textContent = label;
          if (track) track.setAttribute('aria-valuenow', String(shown));
        }
        function frame() {
          if (!failed && !reported && target < 24) target += 0.22;
          if (!failed && pct + 0.05 < target) {
            pct += Math.max(0.45, (target - pct) * 0.16);
            if (pct > target) pct = target;
            render();
          }
          if (!done) requestAnimationFrame(frame);
        }
        window.__trafferProgress = function (p, text) {
          if (failed) return;
          reported = true;
          if (typeof p === 'number' && p > target) target = p > 100 ? 100 : p;
          if (text) label = text;
          if (p >= 100) {
            pct = 100;
            target = 100;
            done = true;
            render();
          }
        };
        window.__trafferFail = function (msg) {
          failed = true;
          done = true;
          label = 'Failed';
          var splash = $('splash');
          if (splash) splash.classList.add('fail');
          var err = $('splash-err');
          if (err) err.textContent = msg || 'The game could not start.';
          render();
        };
        window.addEventListener(
          'error',
          function (ev) {
            var t = ev.target;
            if (t && t.tagName === 'SCRIPT') {
              window.__trafferFail('Couldn’t load the game files. Reload to try again.');
            }
          },
          true
        );
        window.addEventListener('unhandledrejection', function (ev) {
          var reason = ev.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg.indexOf('storage is not allowed') !== -1 || msg.indexOf('Access to storage') !== -1) {
            ev.preventDefault();
          }
        });
        render();
        requestAnimationFrame(frame);
        window.setTimeout(function () {
          if (!window.__trafferBooted && !failed) {
            window.__trafferFail('Couldn’t load the game. Reload to try again.');
          }
        }, 20000);
      })();
    </script>
  </body>
</html>
