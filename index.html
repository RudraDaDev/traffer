<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>TRAFFER — build the city, keep it moving</title>
    <meta
      name="description"
      content="TRAFFER is a road-building traffic puzzle game. Draw streets, avenues and freeways, connect the districts and keep the city moving — 36 campaign levels, endless seeded cities, a daily challenge and full sandbox."
    />
    <meta name="theme-color" content="#0b1015" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Traffer" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* critical inline styles: splash + reset so there is never a white flash */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b1015;
        color: #e8eef2;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          sans-serif;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 90% at 50% 0%, #16212b 0%, #0b1015 60%, #070a0d 100%);
        z-index: 9999;
        transition: opacity 0.45s ease;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: min(38vw, 132px);
        height: auto;
        filter: drop-shadow(0 6px 24px rgba(255, 176, 32, 0.28));
      }
      #splash .t {
        font-size: clamp(20px, 5vw, 30px);
        font-weight: 800;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: #f2f7fa;
      }
      #splash .b {
        width: min(58vw, 240px);
        height: 4px;
        border-radius: 99px;
        background: #1d2a35;
        overflow: hidden;
      }
      #splash .b i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 99px;
        background: linear-gradient(90deg, #ffb020, #ff7a3d);
        animation: sl 1.05s ease-in-out infinite;
      }
      @keyframes sl {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="116" height="116" rx="30" fill="#121c25" />
        <path
          d="M20 96C42 96 40 74 62 74C84 74 82 52 108 52"
          stroke="#2c3d4c"
          stroke-width="18"
          stroke-linecap="round"
        />
        <path
          d="M20 96C42 96 40 74 62 74C84 74 82 52 108 52"
          stroke="#ffb020"
          stroke-width="9"
          stroke-linecap="round"
        />
        <path d="M24 40h34" stroke="#3d566a" stroke-width="11" stroke-linecap="round" />
        <path d="M24 40h34" stroke="#8fa9bd" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 9" />
        <circle cx="62" cy="74" r="6.5" fill="#0b1015" stroke="#8fa9bd" stroke-width="3" />
        <rect x="76" y="66" width="15" height="9" rx="3" fill="#e8503a" transform="rotate(-18 76 66)" />
      </svg>
      <div class="t">TRAFFER</div>
      <div class="b"><i></i></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
